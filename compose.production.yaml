# Opt-in public deployment. Default compose.yaml remains localhost-only.
# Requires Docker Compose >= 2.24.4 for !override.
services:
  backend:
    environment:
      CS2_REQUIRE_STEAM_LOGIN: "true"
      STEAM_PUBLIC_URL: https://${ANALYZER_DOMAIN:?Set ANALYZER_DOMAIN to your hostname}

  frontend:
    ports: !override []

  gateway:
    image: caddy:2.10-alpine
    environment:
      ANALYZER_DOMAIN: ${ANALYZER_DOMAIN:?Set ANALYZER_DOMAIN to your hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
